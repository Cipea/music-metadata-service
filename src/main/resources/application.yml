spring:
  application:
   name: music-metadata-service

  datasource:
    url: jdbc:postgresql://localhost:5432/metadata
    username: metadata_user
    password: password1
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-cliw71aikgnw5d80.us.auth0.com/

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 30m
    artist-of-the-day:
      time-to-live: 24h

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: music-metadata-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p [trace=%X{correlationId}] --- [%15.15t] %-40.40logger{39} : %m%n"