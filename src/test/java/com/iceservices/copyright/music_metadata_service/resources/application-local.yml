spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/metadata
    username: metadata_user
    password: password1

  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true # Helpful for local debugging
        ddl-auto: validate


  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/seed

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-cliw71aikgnw5d80.us.auth0.com/

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 30m

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: music-metadata-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p [trace=%X{correlationId}] --- [%15.15t] %-40.40logger{39} : %m%n"