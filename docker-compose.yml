services:
  postgres:
    image: postgres:16-alpine
    container_name: metadata_db
    environment:
      POSTGRES_USER: metadata_user
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata_user -d metadata"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: . # Tells Compose to build using your Dockerfile in the current directory
    container_name: metadata_api
    ports:
      - "8080:8080"
    environment:
      # Activates application-local.yml
      - SPRING_PROFILES_ACTIVE=local
      # Overrides the localhost URL to use Docker's internal network resolution
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/metadata
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CACHE_TYPE=redis
      - SPRING_CACHE_REDIS_TIME_TO_LIVE=30m
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://dev-cliw71aikgnw5d80.us.auth0.com/
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_FLYWAY_CLEAN_DISABLED=false
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: metadata_cache
    ports:
      - "6379:6379"
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: metadata_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

volumes:
  postgres_data: