services:
  postgres:
    image: postgres:16-alpine
    container_name: metadata_db
    environment:
      POSTGRES_USER: metadata_user
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata_user -d metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metadata_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data: